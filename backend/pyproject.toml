[project]
name="egvox-identity-api"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","asyncpg>=0.30,<1","pydantic-settings>=2.6,<3","PyJWT[crypto]>=2.10,<3","httpx>=0.27,<1","python-multipart>=0.0.20,<1","email-validator>=2.2,<3"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","pytest-asyncio>=0.24,<1","ruff>=0.8,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
asyncio_mode="auto"
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
select=["E","F","I","B","UP"]
ignore=["B008"]

[tool.setuptools.packages.find]
where=["."]
include=["app*","domains*","shared*"]
