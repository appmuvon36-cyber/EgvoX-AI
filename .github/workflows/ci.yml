name: EgvoX CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egvox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Next.js production build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependency-security:
    name: Dependency vulnerability scan (Trivy 0.76.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan Bun lockfile and manifests
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/work:ro"
          -v "${{ runner.temp }}/trivy-cache:/root/.cache/"
          aquasec/trivy:0.76.2
          fs --scanners vuln --include-dev-deps
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /work

  source-security:
    name: Source code security scan (Semgrep 1.187.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan source code
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/src:ro"
          semgrep/semgrep:1.187.0
          semgrep scan --config p/security-audit
          --severity ERROR --error --metrics=off /src

  secret-security:
    name: Secret scan (Gitleaks 8.30.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository files without exposing matched values
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ runner.temp }}:/reports" \
            zricethezav/gitleaks:v8.30.1 \
            dir --redact --no-banner --report-format json \
            --report-path /reports/gitleaks-report.json --exit-code 1 /src
          scan_status=$?
          set -e

          if [ -f "${{ runner.temp }}/gitleaks-report.json" ]; then
            jq -r '.[] | "finding rule=\(.RuleID) file=\(.File) line=\(.StartLine) description=\(.Description)"' "${{ runner.temp }}/gitleaks-report.json"
          fi

          exit "$scan_status"
